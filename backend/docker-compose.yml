services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: securify
      POSTGRES_PASSWORD: securify
      POSTGRES_DB: securify
    ports:
      - "5432:5432"
    volumes:
      - securify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - securify_storage:/app/storage

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - securify_storage:/app/storage

  sandbox:
    build: ./backend/sandbox
    image: securify-sandbox:latest
    profiles: ["build-only"]

volumes:
  securify_pg_data:
  securify_storage: